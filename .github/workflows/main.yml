name: Cicd Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw test

      - name: Build the package
        run: ./mvnw package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-jar
          path: target/*.jar
